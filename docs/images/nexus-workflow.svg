<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570"><rect width="1200" height="570" rx="24" fill="#081519"/><text x="60" y="70" fill="#f1fffc" font-family="Arial" font-size="34" font-weight="700">NEXUS PC CONTROL · flujo de uso</text><text x="60" y="108" fill="#a4c9c4" font-family="Arial" font-size="18">La herramienta informa; la persona decide qué hacer.</text><g font-family="Arial"><rect x="65" y="170" width="320" height="290" rx="18" fill="#10282c" stroke="#42d9c4"/><text x="225" y="230" text-anchor="middle" fill="#64efda" font-size="32">01</text><text x="225" y="285" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">Conectar localmente</text><text x="225" y="335" text-anchor="middle" fill="#c2ded9" font-size="17">Abrir el panel en el equipo</text><text x="225" y="365" text-anchor="middle" fill="#c2ded9" font-size="17">Windows del usuario.</text><rect x="440" y="170" width="320" height="290" rx="18" fill="#10282c" stroke="#42d9c4"/><text x="600" y="230" text-anchor="middle" fill="#64efda" font-size="32">02</text><text x="600" y="285" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">Revisar información</text><text x="600" y="335" text-anchor="middle" fill="#c2ded9" font-size="17">Unidades, espacio, CPU,</text><text x="600" y="365" text-anchor="middle" fill="#c2ded9" font-size="17">RAM y archivos grandes.</text><rect x="815" y="170" width="320" height="290" rx="18" fill="#10282c" stroke="#42d9c4"/><text x="975" y="230" text-anchor="middle" fill="#64efda" font-size="32">03</text><text x="975" y="285" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">Decidir con cuidado</text><text x="975" y="335" text-anchor="middle" fill="#c2ded9" font-size="17">Revisar recomendaciones</text><text x="975" y="365" text-anchor="middle" fill="#c2ded9" font-size="17">y confirmar cada acción.</text></g><path d="M385 315h55m320 0h55" stroke="#64efda" stroke-width="3" stroke-dasharray="7 8"/></svg>